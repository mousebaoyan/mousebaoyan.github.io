name: Publish approved submission

on:
  issues:
    types: [labeled]

permissions: {}

# Different submissions can run concurrently. A second approval of the same
# Issue waits for the first run, including deployment and its status comment.
concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == '审核通过'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      path: ${{ steps.prepare.outputs.path }}
      error: ${{ steps.authorize.outputs.error || steps.prepare.outputs.error || steps.commit.outputs.error }}
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify reviewer and approval
        id: authorize
        uses: actions/github-script@v7
        with:
          script: |
            const { authorize } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/submissions/publish.mjs`);
            try {
              await authorize({ github, context, core });
            } catch (error) {
              core.setOutput('error', error.message);
              core.setFailed(error.message);
            }
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Convert approved Issue snapshot
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const { prepare } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/submissions/publish.mjs`);
            try {
              await prepare({ github, context, core });
            } catch (error) {
              core.setOutput('error', error.message);
              core.setFailed(error.message);
            }
      - name: Validate site before committing
        run: npm run build
      - name: Commit validated content
        id: commit
        uses: actions/github-script@v7
        with:
          script: |
            const { commit } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/submissions/publish.mjs`);
            try {
              await commit({ github, context });
            } catch (error) {
              core.setOutput('error', error.message);
              core.setFailed(error.message);
            }

  # Commits made with GITHUB_TOKEN do not trigger push workflows. Calling the
  # existing deployment workflow explicitly also avoids requiring a personal token.
  deploy:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.event.repository.default_branch }}
    permissions:
      contents: read
      pages: write
      id-token: write

  report:
    if: always() && needs.publish.outputs.authorized == 'true'
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout status reporter
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Report publication result
        uses: actions/github-script@v7
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SUBMISSION_PATH: ${{ needs.publish.outputs.path }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          PUBLICATION_ERROR: ${{ needs.publish.outputs.error }}
        with:
          script: |
            const { report } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/submissions/publish.mjs`);
            await report({ github, context, core }, {
              published: process.env.PUBLISH_RESULT === 'success',
              deployed: process.env.DEPLOY_RESULT === 'success',
              path: process.env.SUBMISSION_PATH,
              pageUrl: process.env.PAGE_URL,
              error: process.env.PUBLICATION_ERROR,
            });
