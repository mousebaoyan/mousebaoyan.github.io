name: 投稿经验贴
description: 分享你的保研经历，供四非同学参考
title: "[经验贴] "
labels: ["投稿", "经验贴"]
body:
  - type: markdown
    attributes:
      value: |
        经验贴用于分享保研申请经历，审核通过后将在网站发布。

        - 可使用昵称或“匿名”署名，本科院校可以不填写。
        - 此 Issue 及上传的附件公开可见，“匿名”署名不会隐藏你的 GitHub 账号。提交前请检查正文和截图，移除姓名、学号、联系方式等不希望公开的信息。
        - 建议注明申请年份，结合实际经历介绍申请背景、准备过程、面试经验与个人总结；引用他人内容时请注明来源。
        - 提交后如需补充或修改，请编辑原 Issue，无需重复投稿。已发布文章的修改也需审核后同步到网站。

  - type: input
    id: title
    attributes:
      label: 标题
      placeholder: 例：2026 年计算机保研申请与面试经验
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: 作者署名
      description: 用于网站文章署名，可填写昵称或“匿名”；Issue 仍会显示你的 GitHub 账号
      placeholder: 匿名 / 你的名字或昵称
    validations:
      required: true

  - type: input
    id: school
    attributes:
      label: 本科院校（选填）
      description: 不想透露可以留空或填写"匿名"
      placeholder: 例：某二本院校

  - type: input
    id: major
    attributes:
      label: 本科专业
      placeholder: 例：计算机科学与技术
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: 去向（录取院校 · 学院）
      placeholder: 例：浙江大学计算机学院
    validations:
      required: true

  - type: input
    id: direction
    attributes:
      label: 研究方向（选填）
      placeholder: 例：机器学习、系统方向

  - type: textarea
    id: excerpt
    attributes:
      label: 摘要
      description: 一两句话概括核心内容，显示在列表页
      placeholder: 例：记录计算机保研的夏令营申请、面试准备与院校选择经历
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: 正文内容
      description: 支持 Markdown，图片可直接上传到 Issue（上传生成的普通 img 标签会自动转换）或使用完整的 HTTPS 链接。不支持其他 HTML。建议包含背景介绍、经历过程、关键心得、给后来者的建议。
      placeholder: |
        ## 我的背景

        ## 经历过程

        ## 关键心得

        ## 给后来者的建议
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: 标签（选填）
      description: 用英文逗号分隔
      placeholder: 例：夏令营, 直博, 985
