name: 分享经验
description: 分享你的保研经历，供四非同学参考
title: "[经验贴] "
labels: ["投稿", "经验贴"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎分享保研经历，投稿经管理员审核后将在网站发布。

        - 可使用昵称或“匿名”署名，本科院校可以不填写。
        - 此 Issue 及上传的附件公开可见，“匿名”署名不会隐藏你的 GitHub 账号。提交前请检查正文和截图，移除姓名、学号、联系方式等不希望公开的信息。
        - 建议注明保研年份，结合实际经历介绍个人背景、准备过程、面试经验与个人总结；引用他人内容时请注明来源。
        - 提交后如需补充或修改，请编辑原 Issue，无需重复投稿。已发布文章的修改也需审核后同步到网站。

  - type: input
    id: title
    attributes:
      label: 标题
      placeholder: 例：2026 年计算机保研经历与面试经验
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: 作者署名
      description: 用于网站文章署名，可填写昵称或“匿名”；Issue 仍会显示你的 GitHub 账号
      placeholder: 匿名 / 你的名字或昵称
    validations:
      required: true

  - type: input
    id: school
    attributes:
      label: 本科院校（选填）
      description: 如不便公开，可留空或填写“匿名”
      placeholder: 例：某二本院校

  - type: input
    id: major
    attributes:
      label: 本科专业
      placeholder: 例：计算机科学与技术
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: 去向（录取院校 · 学院）
      placeholder: 例：浙江大学计算机学院
    validations:
      required: true

  - type: input
    id: direction
    attributes:
      label: 研究方向（选填）
      placeholder: 例：机器学习、系统方向

  - type: textarea
    id: excerpt
    attributes:
      label: 摘要
      description: 用一两句话概括文章内容，便于读者在列表页了解文章主题
      placeholder: 例：记录计算机保研的夏令营申请、面试准备与院校选择经历
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: 正文内容
      description: 支持 Markdown，不支持自定义 HTML 排版。图片可直接上传到 Issue，或用 Markdown 插入完整的 HTTPS 图片链接。建议介绍个人背景、保研经历、经验总结和给学弟学妹的建议。
      placeholder: |
        ## 我的背景

        ## 保研经历

        ## 经验总结

        ## 给学弟学妹的建议
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: 标签（选填）
      description: 用英文逗号分隔
      placeholder: 例：夏令营, 直博, 985
