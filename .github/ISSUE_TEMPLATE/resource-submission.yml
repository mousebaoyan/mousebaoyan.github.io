name: 推荐资源
description: 推荐一个对保研有帮助的网站、工具或资料
title: "[资源] "
labels: ["投稿", "推荐资源"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎推荐与保研相关的网站、工具和资料，审核通过后将收录到网站。

        - 推荐前请先查看网站已有资源，避免重复提交。
        - 请确认链接可以访问，优先填写资源的官方或原始发布地址。
        - 请说明资源的用途和适用场景；如需付费、注册或满足其他使用条件，请在推荐理由中注明。
        - 此 Issue 公开可见，请勿提交含有账号密码、访问令牌或个人隐私的链接与资料。
        - 提交后如需补充或更正，请编辑原 Issue，无需重复提交。

  - type: input
    id: name
    attributes:
      label: 资源名称
      placeholder: 例：保研论坛
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: 一句话描述
      description: 简要说明资源能提供哪些信息或帮助，显示在资源卡片上
      placeholder: 例：汇聚全国高校保研信息的综合论坛，可查各校往年名额和招生要求
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 分类
      options:
        - 官方
        - 情报
        - 材料
        - 技巧
        - 备考
        - 选校
        - 工具
        - 其他
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: 链接
      description: 请填写完整的 HTTPS 或 HTTP 地址
      placeholder: https://
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 推荐理由（选填）
      description: 请说明推荐原因、使用方法或注意事项。支持 Markdown，不支持自定义 HTML 排版。图片可直接上传到 Issue，或用 Markdown 插入完整的 HTTPS 图片链接。
      placeholder: 详细说明使用场景或注意事项

  - type: input
    id: tags
    attributes:
      label: 标签（选填）
      description: 用英文逗号分隔
      placeholder: 例：夏令营, 选校, 信息收集
